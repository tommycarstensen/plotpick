name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v
      # The library installs on its own, without the interface's dependencies.
      - run: |
          python -m venv /tmp/libonly
          /tmp/libonly/bin/pip install .
          cd /tmp && /tmp/libonly/bin/python -c "import plotpick.figure_images, plotpick.extraction, plotpick.exports, plotpick.pmc"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest ruff pycodestyle pyright
      - run: ruff check .
      - run: pycodestyle .
      - run: pyright streamlit_app.py plotpick tests

  exports:
    # The R script must run in R and the LaTeX must compile; neither tool is
    # on the runner image, so without this job those two tests only skip.
    runs-on: ubuntu-24.04
    env:
      PLOTPICK_EXPORT_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core texlive-latex-recommended lmodern
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/test_exports.py -v -rs
