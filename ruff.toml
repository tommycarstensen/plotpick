# Ruff configuration for PlotPick.
#
# Enforced in CI (.github/workflows/test.yml, `lint` job) alongside pyright,
# so new code is held to this standard rather than only being checked by hand.

line-length = 88

[lint]
# Ruff's default rule set (E4/E7/E9, F) plus the extras that caught real
# issues in this codebase: bugbear (loop-variable capture), blind-except,
# datetime hygiene, and the modernisation/refurb rules.
select = ["E", "F", "W", "B", "BLE", "C4", "DTZ", "FURB", "RUF", "SIM", "UP"]

ignore = [
    # Export filenames and the generated-R header deliberately use the
    # viewer's local time -- a UTC timestamp on a downloaded file would be
    # more confusing, not less. Only two call sites, both user-facing.
    "DTZ005",
]

# Line length (E501) is enforced. The one exception, the example JSON rows in
# the extraction prompt, carries its own `# noqa: E501` so that pycodestyle
# (run in CI with the same 88-column limit, see setup.cfg) agrees with ruff.
