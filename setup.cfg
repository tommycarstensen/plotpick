# pycodestyle (PEP 8) settings, enforced in CI alongside ruff and pyright.
# PEP 8 lets a project agree on a limit above 79; this matches ruff.toml.
[pycodestyle]
max-line-length = 88
exclude = .git,__pycache__,.pytest_cache,.ruff_cache,.venv,venv

# Tests import the plotpick package from the repo root. Putting the root on the
# path here, rather than via sys.path.insert() in each test file, keeps the
# imports at the top of the module (pycodestyle E402).
[tool:pytest]
pythonpath = .
